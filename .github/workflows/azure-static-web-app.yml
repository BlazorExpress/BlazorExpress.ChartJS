name: Azure Static WebApp (Blazor WebAssembly)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      prod_release:
        description: 'Do you want to release to production?'
        required: true
        default: false
        type: boolean

jobs:
  build_and_deploy_job:
    # Production only from a manual run with prod_release ticked; open pull requests deploy previews.
    # Keep the whole condition inside one ${{ }}: text outside it turns the condition into an always-true string.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.prod_release) || (github.event_name == 'pull_request' && github.event.action != 'closed') }}
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: "net11.0"
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      PROJECT: "BlazorExpress.ChartJS.Demo.WebAssembly/BlazorExpress.ChartJS.Demo.WebAssembly.csproj"
      BUILD_CONFIG: "Release"

    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # The .NET 11 SDK: the library multi-targets up to net11.0, and SDK 11 also builds the demo's net9.0 target.
      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      
      # .NET Restore
      - name: .NET Restore
        run: dotnet restore ${{ env.PROJECT }}
        
      # .NET Build
      - name: .NET Build
        run: dotnet build ${{ env.PROJECT }} -c ${{ env.BUILD_CONFIG }} -f ${{ env.DOTNET_VERSION }} --no-restore
        
      # .NET Publish. No --no-build: publish fills the index.html placeholders (fingerprinted script URLs, import map,
      # preload) only when it builds; with --no-build they stay unfilled and the site does not start.
      - name: .NET Publish
        run: dotnet publish ${{ env.PROJECT }} -c ${{ env.BUILD_CONFIG }} -o output -f ${{ env.DOTNET_VERSION }} --no-restore
      
        
      # Azure Static Web App Deployment Action
      - name: Build And Deploy Blazor WASM App
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_FOREST_0C3A9ED10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "output/wwwroot" # Path to your .csproj folder
          api_location: "" # Leave empty if no API
          output_location: "" # Leave empty when using 'upload' action with a pre-built app
          skip_api_build: true
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_FOREST_0C3A9ED10 }}
          action: "close"
